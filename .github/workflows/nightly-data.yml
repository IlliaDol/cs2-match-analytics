name: nightly-data

# Runs the data-gated suite on real data once a night (UTC). The private Kaggle
# CSVs are NOT in the repo — they are fetched from DATA_SOURCE_URL, which you set
# as a repo secret (see docs/CI_DATA_JOB.md).
#
# If DATA_SOURCE_URL is not configured the job skips *green* with a notice, so a
# missing secret never looks like a broken build. Once the secret exists, the
# heavy path below runs unchanged.

on:
  schedule:
    - cron: "23 3 * * *"  # 03:23 UTC daily
  workflow_dispatch: {}

jobs:
  data-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch private data
        id: fetch
        env:
          DATA_SOURCE_URL: ${{ secrets.DATA_SOURCE_URL }}
          DATA_SOURCE_TOKEN: ${{ secrets.DATA_SOURCE_TOKEN }}
        run: |
          mkdir -p data/raw
          if [ -z "$DATA_SOURCE_URL" ]; then
            echo "::notice::DATA_SOURCE_URL is not set — skipping the real-data suite. See docs/CI_DATA_JOB.md to enable it."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          # GitHub Contents API URLs need the raw media type; plain HTTP URLs do not care.
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $DATA_SOURCE_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "$DATA_SOURCE_URL" -o data_raw.zip
          unzip -o data_raw.zip -d data/raw

      - name: Install
        if: steps.fetch.outputs.available == 'true'
        run: pip install -e ".[dev]"

      - name: Rebuild artifacts the data-gated tests need
        if: steps.fetch.outputs.available == 'true'
        run: |
          python scripts/build_interim.py
          python scripts/build_features_v1.py
          python -m cs2analytics.models.train
          python -m cs2analytics.serve.monitor

      - name: Run the full suite (skip guards keyed on file existence make this honest)
        if: steps.fetch.outputs.available == 'true'
        run: pytest -q

      - name: Upload honest metrics as an artifact
        if: steps.fetch.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs2-metrics
          path: outputs/*.csv
