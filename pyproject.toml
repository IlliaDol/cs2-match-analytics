[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs2analytics"
version = "0.1.0"
description = "Calibrated win-probability modeling for professional CS2 matches"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cs2analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
