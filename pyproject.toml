[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs2analytics"
version = "0.1.0"
description = "Calibrated win-probability modeling for professional CS2 matches"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.7", "matplotlib>=3.8"]
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.2",
    "pymc>=5.10",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "joblib>=1.3",
    "pydantic>=2.6",
    "streamlit>=1.33",
    "mlflow>=2.11",
]
llm = ["openai>=1.30"]
spark = ["pyspark>=3.5"]
all = ["cs2analytics[ml,serve,llm,spark]"]

[tool.hatch.build.targets.wheel]
packages = ["src/cs2analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
